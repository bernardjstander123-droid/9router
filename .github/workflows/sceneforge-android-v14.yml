name: SceneForge Studio Android debug APK
on:
  push:
    branches: [sceneforge-android-v14]
    paths: ['sceneforge-android/**', '.github/workflows/sceneforge-android-v14.yml']
  pull_request:
    paths: ['sceneforge-android/**', '.github/workflows/sceneforge-android-v14.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sceneforge-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build SceneForge native Android WebView wrapper
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Check APK and Android signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SceneForge-v14-debug-APK
          path: sceneforge-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
