name: BTU Android APK
on:
  push:
    paths:
      - 'btu-android/**'
      - '.github/workflows/btu-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: btu-android
    steps:
      - name: Checkout BTU sources
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Android SDK using runner tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          command -v sdkmanager
          yes | sdkmanager --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          test -f "${ANDROID_HOME}/platforms/android-35/android.jar"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile BTU debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload BTU debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BTU-Cinema-debug-APK
          path: btu-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
