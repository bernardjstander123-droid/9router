name: Motion Studio Android APK
on:
  push:
    branches: [motion-studio-android-build]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android packages using preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: motion-studio
        run: gradle --no-daemon assembleDebug
      - name: Verify APK archive
        run: |
          test -s motion-studio/app/build/outputs/apk/debug/app-debug.apk
          unzip -t motion-studio/app/build/outputs/apk/debug/app-debug.apk | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify motion-studio/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MotionStudio-installable-debug-apk
          path: motion-studio/app/build/outputs/apk/debug/app-debug.apk
