name: BTU CPU PTE export
on:
  push:
    branches: [fix/btu-cpu-pte-export]
    paths:
      - 'btu-android/tools/build_cpu_pte.py'
      - '.github/workflows/btu-cpu-pte.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU-only PyTorch and ExecuTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch executorch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Verify dependencies
        run: |
          python -c "import torch, executorch; from executorch.backends.xnnpack.partition.xnnpack_partitioner import XnnpackPartitioner; print('torch', torch.__version__)"
      - name: Export BTU CPU test model
        run: python btu-android/tools/build_cpu_pte.py --output dist/btu_cinema_inference.pte
      - name: Validate artifact exists
        run: test -s dist/btu_cinema_inference.pte
      - name: Upload PTE artifact
        uses: actions/upload-artifact@v4
        with:
          name: btu-cpu-test-pte
          path: dist/btu_cinema_inference.pte
          if-no-files-found: error
