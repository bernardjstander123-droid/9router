plugins { id 'com.android.application' }
android {
  namespace 'za.nexusremote.portal'
  compileSdk 35
  defaultConfig {
    applicationId 'za.nexusremote.portal'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '1.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  buildTypes { release { minifyEnabled false } }
}
